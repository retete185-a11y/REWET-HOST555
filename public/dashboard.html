<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REWET HOST — Панель</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="header">
    <div class="container" style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        width:100%;
    ">
        <a href="/" class="logo">REWET HOST</a>

        <button class="btn btn-secondary" onclick="logout()">
            Выйти
        </button>
    </div>
</header>

<main class="container" style="padding-top:40px;">

    <h1 id="welcome">Панель управления</h1>

    <p class="text-muted" style="margin-top:8px;">
        Управляй аккаунтом и игровыми серверами.
    </p>

    <div style="
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
        margin-top:30px;
    ">

        <div class="card">
            <p class="text-muted">Пользователь</p>
            <h2 id="username" style="margin-top:10px;">
                Загрузка...
            </h2>
        </div>

        <div class="card">
            <p class="text-muted">Баланс</p>
            <h2 id="balance" class="text-red" style="margin-top:10px;">
                0 ₽
            </h2>
        </div>

        <div class="card">
            <p class="text-muted">Серверов</p>
            <h2 id="serverCount" style="margin-top:10px;">
                0
            </h2>
        </div>

    </div>

    <section style="margin-top:35px;">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            flex-wrap:wrap;
        ">

            <div>
                <h2>Мои серверы</h2>

                <p class="text-muted" style="margin-top:6px;">
                    Здесь будут отображаться твои серверы.
                </p>
            </div>

            <button class="btn btn-primary" onclick="createServer()">
                + Создать сервер
            </button>

        </div>

        <div id="servers" style="margin-top:20px;">
            <div class="card">
                Загрузка серверов...
            </div>
        </div>

    </section>

</main>

<script src="/app.js"></script>

<script>

async function loadDashboard() {

    const token = getToken();

    if (!token) {
        window.location.href = "/login.html";
        return;
    }

    try {

        const result = await apiRequest("/auth/me");

        const user = result.user;

        document.getElementById("username").textContent =
            user.username;

        document.getElementById("balance").textContent =
            `${user.balance} ₽`;

        document.getElementById("welcome").textContent =
            `Привет, ${user.username}!`;

        await loadServers();

    } catch (error) {

        removeToken();
        window.location.href = "/login.html";
    }
}

async function loadServers() {

    const container =
        document.getElementById("servers");

    try {

        const result =
            await apiRequest("/servers");

        const servers =
            result.servers || [];

        document.getElementById("serverCount").textContent =
            servers.length;

        if (servers.length === 0) {

            container.innerHTML = `
                <div class="card">
                    <h3>Серверов пока нет</h3>

                    <p class="text-muted" style="margin-top:8px;">
                        Создай свой первый игровой сервер.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML = servers.map(server => `

            <div class="card" style="margin-bottom:12px;">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:15px;
                    flex-wrap:wrap;
                ">

                    <div>

                        <h3>${escapeHtml(server.name)}</h3>

                        <p class="text-muted" style="margin-top:7px;">
                            ${escapeHtml(server.game)}
                        </p>

                    </div>

                    <div>
                        Статус:
                        <strong>${escapeHtml(server.status)}</strong>
                    </div>

                </div>

            </div>

        `).join("");

    } catch (error) {

        container.innerHTML = `
            <div class="card">
                Не удалось загрузить серверы.
            </div>
        `;
    }
}

function createServer() {

    alert(
        "Система создания серверов будет добавлена следующим этапом."
    );
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

loadDashboard();

</script>

</body>
</html>
