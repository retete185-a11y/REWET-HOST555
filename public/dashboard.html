<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REWET HOST — Панель</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6366f1;
        }

        .logout {
            border: 0;
            background: #ef4444;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .profile {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .profile h2 {
            margin-bottom: 10px;
        }

        .balance {
            color: #22c55e;
            font-size: 20px;
            margin-top: 8px;
        }

        .section {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #0b0f19;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .servers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .server {
            background: #0b0f19;
            border: 1px solid #293548;
            border-radius: 12px;
            padding: 20px;
        }

        .server h3 {
            margin-bottom: 12px;
        }

        .server p {
            color: #9ca3af;
            margin: 6px 0;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 6px;
            background: #374151;
        }

        .owner {
            color: #818cf8;
        }

        .co-owner {
            color: #f59e0b;
        }

        .message {
            margin-top: 12px;
            color: #f59e0b;
        }

        .empty {
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 15px;
            }

            main {
                padding: 20px 12px;
            }

            .profile,
            .section {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        REWET <span>HOST</span>
    </div>

    <button class="logout" onclick="logout()">
        Выйти
    </button>
</header>

<main>

    <div class="profile">
        <h2>Мой профиль</h2>

        <p>
            Пользователь:
            <strong id="username">Загрузка...</strong>
        </p>

        <p>
            Email:
            <strong id="email">Загрузка...</strong>
        </p>

        <p class="balance">
            Баланс: <span id="balance">0</span> ₽
        </p>
    </div>

    <div class="section">
        <h2>Создать сервер</h2>

        <input
            id="serverName"
            type="text"
            placeholder="Название сервера"
        >

        <input
            id="game"
            type="text"
            placeholder="Игра, например Minecraft"
        >

        <button onclick="createServer()">
            Создать сервер
        </button>

        <div id="createMessage" class="message"></div>
    </div>

    <div class="section">
        <h2>Добавить совладельца</h2>

        <p style="color:#9ca3af; margin-bottom:15px;">
            Введи ключ доступа, который выдал владелец сервера.
        </p>

        <input
            id="accessKey"
            type="text"
            placeholder="Ключ доступа"
        >

        <button onclick="useAccessKey()">
            Добавить сервер
        </button>

        <div id="keyMessage" class="message"></div>
    </div>

    <div class="section">
        <h2>Мои серверы</h2>

        <div id="servers" class="servers">
            <p class="empty">
                Загрузка серверов...
            </p>
        </div>
    </div>

</main>

<script>

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/login";
}

// PROFILE
// ============================

async function loadProfile() {

            "/api/auth/me",
            {
                headers: {
                    Authorization: "Bearer " + token
                }
            }
        );

        if (!response.ok) {
            logout();
            return;
        }
