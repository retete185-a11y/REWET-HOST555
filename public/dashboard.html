<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REWET HOST — Панель</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f6f8;
    color:#20242a;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
}

a{text-decoration:none;color:inherit}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:19px;
    font-weight:800;
}

.logo span{
    color:#89919d;
}

.account{
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
}

.account-name{
    font-weight:600;
}

.balance{
    color:#68707c;
}

.container{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 50px;
}

.account-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:22px;
    margin-bottom:24px;
}

.title{
    font-size:18px;
    font-weight:700;
    margin-bottom:20px;
}

.account-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.info-label{
    color:#89919d;
    font-size:11px;
    margin-bottom:5px;
}

.info-value{
    font-size:13px;
    font-weight:600;
}

.balance-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.topup{
    color:#3678d8;
    cursor:pointer;
    font-size:12px;
}

.section{
    margin-top:24px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.section-title{
    font-size:17px;
    font-weight:700;
}

.table-wrap{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:8px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#fafafa;
    color:#747c87;
    font-size:11px;
    font-weight:600;
    text-align:left;
    padding:13px 16px;
    border-bottom:1px solid #e5e7eb;
}

td{
    padding:14px 16px;
    border-bottom:1px solid #edf0f2;
}

tr:last-child td{
    border-bottom:0;
}

.server-id{
    font-weight:700;
}

.status{
    display:inline-flex;
    padding:5px 9px;
    border-radius:5px;
    font-size:11px;
    font-weight:600;
}

.status-on{
    background:#e9f8ef;
    color:#25834a;
}

.status-off{
    background:#f1f2f4;
    color:#747b84;
}

.status-start{
    background:#fff5df;
    color:#9b6b15;
}

.action{
    display:inline-block;
    padding:7px 11px;
    background:#f0f2f5;
    border:1px solid #e0e3e7;
    border-radius:5px;
    font-size:11px;
    cursor:pointer;
}

.action:hover{
    background:#e7e9ec;
}

.empty{
    padding:28px;
    text-align:center;
    color:#8b929c;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:8px;
}

.create-btn{
    background:#20242a;
    color:#fff;
    border:0;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
    font-size:12px;
}

.footer{
    text-align:center;
    color:#9299a3;
    font-size:11px;
    padding:30px 0;
}

.logout{
    color:#c34b4b;
    cursor:pointer;
    margin-left:18px;
    font-size:12px;
}

@media(max-width:700px){

    .header{
        padding:0 14px;
    }

    .account{
        gap:6px;
    }

    .balance{
        display:none;
    }

    .container{
        padding:18px 10px 35px;
    }

    .account-grid{
        grid-template-columns:1fr 1fr;
    }

    .account-card{
        padding:16px;
    }

    .title{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        REWET <span>HOST</span>
    </div>

    <div class="account">
        <span class="account-name" id="topName">
            Загрузка...
        </span>

        <span>|</span>

        <span class="balance" id="topBalance">
            0.00 ₽
        </span>

        <span class="logout" onclick="logout()">
            Выйти
        </span>
    </div>

</header>


<main class="container">

    <!-- ACCOUNT -->

    <section class="account-card">

        <div class="title">
            Информация об аккаунте
        </div>

        <div class="account-grid">

            <div>
                <div class="info-label">
                    ID аккаунта
                </div>

                <div class="info-value" id="accountId">
                    —
                </div>
            </div>


            <div>
                <div class="info-label">
                    Имя
                </div>

                <div class="info-value" id="firstName">
                    —
                </div>
            </div>


            <div>
                <div class="info-label">
                    Фамилия
                </div>

                <div class="info-value" id="lastName">
                    —
                </div>
            </div>


            <div>
                <div class="info-label">
                    E-Mail
                </div>

                <div class="info-value" id="email">
                    —
                </div>
            </div>


            <div>
                <div class="info-label">
                    Баланс
                </div>

                <div class="balance-row">

                    <span
                        class="info-value"
                        id="balance">
                        0.00 ₽
                    </span>

                    <span
                        class="topup"
                        onclick="topup()">
                        Пополнить баланс
                    </span>

                </div>

            </div>

        </div>

    </section>


    <!-- SERVERS -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                Мои серверы
            </div>

            <button
                class="create-btn"
                onclick="createServer()">
                + Создать сервер
            </button>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Статус</th>
                        <th>Тариф</th>
                        <th>IP</th>
                        <th>Действия</th>
                    </tr>

                </thead>

                <tbody id="serversTable">

                    <tr>
                        <td colspan="5"
                            style="text-align:center;color:#89919d">
                            Загрузка серверов...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- WEBSITES -->

    <section class="section">

        <div class="section-title">
            Мои сайты
        </div>

        <div class="empty">
            На данный момент у вас нет сайтов.
        </div>

    </section>


    <!-- VDS -->

    <section class="section">

        <div class="section-title">
            Мои VDS
        </div>

        <div class="empty">
            На данный момент у вас нет VDS.
        </div>

    </section>


    <div class="footer">
        © 2026 REWET HOST
    </div>

</main>


<script>

let currentUser = null;


/* =========================
   API
========================= */

async function api(url, options = {}){

    const token =
        localStorage.getItem("token");

    const headers = {
        "Content-Type":"application/json",
        ...(options.headers || {})
    };

    if(token){
        headers.Authorization =
            "Bearer " + token;
    }

    const response =
        await fetch(url,{
            ...options,
            headers
        });

    const data =
        await response.json().catch(() => ({}));

    if(response.status === 401){

        logout();

        throw new Error(
            "Сессия истекла"
        );
    }

    if(!response.ok){

        throw new Error(
            data.message ||
            "Ошибка запроса"
        );
    }

    return data;
}


/* =========================
   USER
========================= */

async function loadUser(){

    try{

        const data =
            await api("/api/auth/me");

        currentUser =
            data.user || data;

        const user =
            currentUser;

        document.getElementById(
            "accountId"
        ).textContent =
            "#" + user.id;

        document.getElementById(
            "email"
        ).textContent =
            user.email || "—";

        document.getElementById(
            "balance"
        ).textContent =
            Number(user.balance || 0)
            .toFixed(2) + " ₽";

        document.getElementById(
            "topBalance"
        ).textContent =
            Number(user.balance || 0)
            .toFixed(2) + " ₽";


        /*
         * Сейчас база REWET HOST
         * содержит username, а не
         * отдельные имя/фамилию.
         */

        document.getElementById(
            "firstName"
        ).textContent =
            user.first_name ||
            user.firstName ||
            user.username ||
            "—";

        document.getElementById(
            "lastName"
        ).textContent =
            user.last_name ||
            user.lastName ||
            "—";


        const name =
            (
                (user.first_name ||
                user.firstName ||
                user.username ||
                "") +
                " " +
                (user.last_name ||
                user.lastName ||
                "")
            ).trim();

        document.getElementById(
            "topName"
        ).textContent =
            name || "Аккаунт";

    }catch(error){

        console.error(error);

    }

}


/* =========================
   SERVERS
========================= */

async function loadServers(){

    const tbody =
        document.getElementById(
            "serversTable"
        );

    try{

        const data =
            await api("/api/servers");

        const servers =
            data.servers ||
            data ||
            [];

        if(!Array.isArray(servers) ||
           servers.length === 0){

            tbody.innerHTML = `
                <tr>
                    <td colspan="5"
                        style="text-align:center;color:#89919d;padding:28px">
                        У вас пока нет серверов.
                    </td>
                </tr>
            `;

            return;
        }


        tbody.innerHTML =
            servers.map(server => {

                let statusText =
                    "Выключен";

                let statusClass =
                    "status-off";


                if(server.status === "running"){

                    statusText =
                        "Включен";

                    statusClass =
                        "status-on";

                }else if(
                    server.status === "starting" ||
                    server.status === "stopping"
                ){

                    statusText =
                        server.status === "starting"
                        ? "Запускается"
                        : "Останавливается";

                    statusClass =
                        "status-start";
                }


                /*
                 * Тариф и IP пока не хранятся
                 * в таблице servers.
                 */

                const tariff =
                    server.tariff ||
                    server.plan ||
                    "GTA SAMP/CRMP - Lite";

                const ip =
                    server.ip ||
                    "—";


                return `
                    <tr>

                        <td class="server-id">
                            #${server.id}
                        </td>

                        <td>
                            <span
                                class="status ${statusClass}">
                                ${statusText}
                            </span>
                        </td>

                        <td>
                            ${escapeHtml(tariff)}
                        </td>

                        <td>
                            ${escapeHtml(ip)}
                        </td>

                        <td>

                            <button
                                class="action"
                                onclick="openServer(${server.id})">
                                Управление
                            </button>

                        </td>

                    </tr>
                `;

            }).join("");

    }catch(error){

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="5"
                    style="text-align:center;color:#c34b4b;padding:28px">
                    Не удалось загрузить серверы.
                </td>
            </tr>
        `;

    }

}


/* =========================
   ACTIONS
========================= */

function openServer(id){

    window.location.href =
        "/server?id=" + encodeURIComponent(id);

}


function createServer(){

    window.location.href =
        "/server";
}


function topup(){

    alert(
        "Пополнение баланса скоро будет доступно."
    );

}


function logout(){

    localStorage.removeItem("token");

    window.location.href =
        "/login";

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

(async function(){

    if(!localStorage.getItem("token")){

        window.location.href =
            "/login";

        return;
    }

    await loadUser();

    await loadServers();

})();

</script>

</body>
</html>
