<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REWET HOST — Вход</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 30px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #6366f1;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 9px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        .message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            color: #f59e0b;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
        }

        .register a {
            color: #818cf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        REWET <span>HOST</span>
    </div>

    <div class="subtitle">
        Вход в панель управления
    </div>

    <form id="loginForm">

        <input
            id="login"
            type="text"
            placeholder="Логин или Email"
            autocomplete="username"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Войти
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
        Нет аккаунта?
        <a href="/register">Регистрация</a>
    </div>

</div>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "Выполняется вход...";

    const login =
        document.getElementById("login").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        const response = await fetch(
            "/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    login,
                    password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Ошибка авторизации"
            );
        }

        if (!data.token) {
            throw new Error(
                "Сервер не вернул токен авторизации"
            );
        }

        localStorage.setItem(
            "token",
            data.token
        );

        message.textContent =
            "Вход выполнен!";

        setTimeout(() => {
            window.location.href = "/dashboard";
        }, 300);

    } catch (error) {

        message.textContent =
            error.message;

    }

});

</script>

</body>
</html>
