<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REWET HOST — Вход</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo">REWET HOST</a>
    </div>
</header>

<main class="container" style="max-width: 500px; padding-top: 70px;">

    <div class="card">

        <h1 style="margin-bottom: 10px;">
            Вход
        </h1>

        <p class="text-muted" style="margin-bottom: 30px;">
            Войди в свой аккаунт REWET HOST
        </p>

        <form id="loginForm">

            <label>Логин или Email</label>

            <input
                class="input"
                type="text"
                id="login"
                placeholder="Логин или email"
                required
                style="margin: 8px 0 18px;"
            >

            <label>Пароль</label>

            <input
                class="input"
                type="password"
                id="password"
                placeholder="Пароль"
                required
                style="margin: 8px 0 25px;"
            >

            <button
                class="btn btn-primary"
                type="submit"
                style="width: 100%;"
            >
                Войти
            </button>

        </form>

        <div
            id="message"
            style="margin-top: 20px; text-align: center;"
        ></div>

        <p
            style="text-align: center; margin-top: 25px;"
            class="text-muted"
        >
            Нет аккаунта?
            <a href="/register.html" class="text-red">
                Зарегистрироваться
            </a>
        </p>

    </div>

</main>

<script src="/app.js"></script>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const login =
            document.getElementById("login").value.trim();

        const password =
            document.getElementById("password").value;

        message.textContent = "Выполняется вход...";
        message.style.color = "#aaa";

        try {

            const result = await apiRequest(
                "/auth/login",
                {
                    method: "POST",
                    body: JSON.stringify({
                        login,
                        password
                    })
                }
            );

            saveToken(result.token);

            message.textContent =
                "Вход выполнен!";

            message.style.color = "#35d07f";

            setTimeout(() => {
                window.location.href = "/dashboard.html";
            }, 500);

        } catch (error) {

            message.textContent = error.message;
            message.style.color = "#ff2020";
        }
    });
</script>

</body>
</html>
