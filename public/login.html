<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — REWET HOST</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #181818 0, #080808 40%),
                #050505;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .logo span {
            color: #888;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
            color: #fff;
            padding: 0 14px;
            outline: none;
            margin-bottom: 18px;
            font-size: 14px;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 10px;
            background: #fff;
            color: #000;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            display: none;
            background: #241010;
            border: 1px solid #4a1e1e;
            color: #ff8f8f;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .register a {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 13px;
            text-decoration: none;
        }

        .back:hover {
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        REWET <span>HOST</span>
    </div>

    <div class="subtitle">
        Вход в панель управления
    </div>

    <div id="error" class="error"></div>

    <form id="loginForm">

        <label for="login">
            Логин или E-Mail
        </label>

        <input
            type="text"
            id="login"
            placeholder="Введите логин или email"
            autocomplete="username"
            required
        >

        <label for="password">
            Пароль
        </label>

        <input
            type="password"
            id="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            Войти
        </button>

    </form>

    <div class="register">
        Нет аккаунта?
        <a href="/register">Зарегистрироваться</a>
    </div>

    <a class="back" href="/">
        ← Вернуться на главную
    </a>

</div>

<script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const loginButton = document.getElementById("loginButton");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    // Если пользователь уже авторизован —
    // сразу открываем панель.
    const existingToken = localStorage.getItem("token");

    if (existingToken) {
        window.location.href = "/dashboard";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        errorBox.style.display = "none";
        loginButton.disabled = true;
        loginButton.textContent = "Вход...";

        const login = document.getElementById("login").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    login: login,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.message || "Не удалось войти"
                );
            }

            if (!data.token) {
                throw new Error("Сервер не вернул токен авторизации");
            }

            // Сохраняем авторизацию.
            // Она НЕ удаляется при закрытии сайта.
            localStorage.setItem("token", data.token);

            // Сохраняем данные пользователя для быстрого отображения.
            if (data.user) {
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );
            }

            window.location.href = "/dashboard";

        } catch (error) {
            console.error(error);

            showError(
                error.message || "Ошибка подключения к серверу"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Войти";
        }
    });
</script>

</body>
</html>
