<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REWET HOST — Регистрация</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 30px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #6366f1;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 9px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        .message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            color: #f59e0b;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
        }

        .login a {
            color: #818cf8;
            text-decoration: none;
        }

        .rules {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        REWET <span>HOST</span>
    </div>

    <div class="subtitle">
        Создание аккаунта
    </div>

    <form id="registerForm">

        <input
            id="username"
            type="text"
            placeholder="Имя пользователя"
            autocomplete="username"
            minlength="3"
            maxlength="32"
            required
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <input
            id="password2"
            type="password"
            placeholder="Повторите пароль"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <div class="rules">
            Пароль должен содержать минимум 6 символов.
        </div>

        <button type="submit">
            Зарегистрироваться
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
        Уже есть аккаунт?
        <a href="/login">Войти</a>
    </div>

</div>

<script>

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const password2 =
            document
                .getElementById("password2")
                .value;

        if (password !== password2) {

            message.textContent =
                "Пароли не совпадают.";

            return;
        }

        if (password.length < 6) {

            message.textContent =
                "Пароль должен содержать минимум 6 символов.";

            return;
        }

        message.textContent =
            "Создание аккаунта...";

        try {

            const response = await fetch(
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Ошибка регистрации"
                );
            }

            message.textContent =
                "Аккаунт создан! Перенаправление...";

            setTimeout(() => {
                window.location.href = "/login";
            }, 800);

        } catch (error) {

            message.textContent =
                error.message;

        }
    }
);

</script>

</body>
</html>
