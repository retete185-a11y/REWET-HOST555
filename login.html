<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REWET HOST — Вход</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 10%, rgba(0,119,255,.22), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(0,90,255,.15), transparent 35%),
        #06101f;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: 900;
    margin-bottom: 25px;
}

.logo span {
    color: #1683ff;
}

.card {
    background: rgba(12,23,41,.94);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 32px;
    box-shadow: 0 25px 80px rgba(0,0,0,.35);
}

.card h1 {
    text-align: center;
    font-size: 25px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #899bb2;
    font-size: 13px;
    margin-bottom: 28px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 12px;
    color: #aebed0;
    margin-bottom: 8px;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    height: 50px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,.09);
    outline: none;
    background: #081426;
    color: white;
    padding: 0 15px;
    font-size: 14px;
    transition: .2s;
}

input:focus {
    border-color: #1683ff;
    box-shadow: 0 0 0 3px rgba(22,131,255,.10);
}

.password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #8192a8;
    cursor: pointer;
    font-size: 17px;
}

.button {
    width: 100%;
    height: 50px;
    margin-top: 8px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(135deg, #1683ff, #005de5);
    color: white;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 10px 25px rgba(0,100,255,.20);
}

.button:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 30px rgba(0,100,255,.30);
}

.button:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 16px;
}

.message.error {
    display: block;
    color: #ffb4b4;
    background: rgba(239,68,68,.10);
    border: 1px solid rgba(239,68,68,.20);
}

.message.success {
    display: block;
    color: #a7f3c0;
    background: rgba(34,197,94,.10);
    border: 1px solid rgba(34,197,94,.20);
}

.links {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: #71839a;
}

.links a {
    color: #4da2ff;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

.back {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: #708299;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: white;
}

.loading {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 480px) {

    .card {
        padding: 25px 20px;
    }

    .logo {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        ⚡ REWET <span>HOST</span>
    </div>

    <div class="card">

        <h1>С возвращением 👋</h1>

        <p class="subtitle">
            Войдите в свой аккаунт REWET HOST
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="login">
                    Логин или Email
                </label>

                <input
                    id="login"
                    type="text"
                    placeholder="Введите логин или email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <div class="input-wrap">

                    <input
                        id="password"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="button"
                id="loginButton"
            >

                <span id="buttonText">
                    Войти
                </span>

                <span
                    id="loadingText"
                    class="loading"
                >
                    <span class="spinner"></span>
                    Входим...
                </span>

            </button>

        </form>


        <div class="links">

            Нет аккаунта?

            <a href="register.html">
                Создать аккаунт
            </a>

        </div>


        <a
            href="index.html"
            class="back"
        >
            ← Вернуться на главную
        </a>

    </div>

</div>


<script>

const API_URL =
    "https://rewet-host-api.onrender.com";

const form =
    document.getElementById("loginForm");

const loginInput =
    document.getElementById("login");

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

const message =
    document.getElementById("message");

const loginButton =
    document.getElementById("loginButton");

const buttonText =
    document.getElementById("buttonText");

const loadingText =
    document.getElementById("loadingText");


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


// =====================================================
// PASSWORD
// =====================================================

togglePassword.addEventListener(
    "click",
    function() {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            togglePassword.textContent = "🙈";

        } else {

            passwordInput.type = "password";

            togglePassword.textContent = "👁";

        }

    }
);


// =====================================================
// LOGIN
// =====================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        showMessage("", "");

        const login =
            loginInput.value.trim();

        const password =
            passwordInput.value;


        if (!login) {

            showMessage(
                "Введите логин или email.",
                "error"
            );

            return;

        }


        if (!password) {

            showMessage(
                "Введите пароль.",
                "error"
            );

            return;

        }


        loginButton.disabled = true;

        buttonText.style.display = "none";

        loadingText.style.display = "flex";


        try {

            const response =
                await fetch(
                    API_URL + "/api/login",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({
                            login: login,
                            password: password
                        })
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch (e) {

                data = {};

            }


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    "Не удалось войти в аккаунт."
                );

            }


            showMessage(
                "Вход выполнен успешно! Перенаправляем...",
                "success"
            );


            /*
             * ВАЖНО:
             * После успешного входа
             * отправляем пользователя
             * прямо в панель управления.
             */

            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                500
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            if (
                error instanceof TypeError
            ) {

                showMessage(
                    "Не удалось подключиться к серверу REWET HOST. Проверьте соединение и попробуйте снова.",
                    "error"
                );

            } else {

                showMessage(
                    error.message ||
                    "Произошла ошибка при входе.",
                    "error"
                );

            }


            loginButton.disabled = false;

            buttonText.style.display =
                "inline";

            loadingText.style.display =
                "none";

        }

    }
);

</script>

</body>
</html>
