<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — REWET HOST</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #2563eb 0%,
                    #0f172a 45%,
                    #020617 100%
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #60a5fa;
        }

        .logo p {
            margin-top: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .card {
            background: rgba(15, 23, 42, 0.94);

            border: 1px solid rgba(
                96,
                165,
                250,
                0.25
            );

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 25px 60px rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            backdrop-filter: blur(15px);
        }

        .title {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border-radius: 12px;

            border: 1px solid #334155;

            background: #020617;
            color: white;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(
                    59,
                    130,
                    246,
                    0.15
                );
        }

        input::placeholder {
            color: #64748b;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 52px;
        }

        .show-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;
            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            font-size: 18px;
        }

        .show-password:hover {
            color: white;
        }

        .message {
            display: none;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;

            line-height: 1.4;
        }

        .message.error {
            display: block;

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.12
                );

            border:
                1px solid
                rgba(
                    239,
                    68,
                    68,
                    0.3
                );

            color: #fca5a5;
        }

        .message.success {
            display: block;

            background:
                rgba(
                    34,
                    197,
                    94,
                    0.12
                );

            border:
                1px solid
                rgba(
                    34,
                    197,
                    94,
                    0.3
                );

            color: #86efac;
        }

        .login-btn {
            width: 100%;
            height: 52px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 10px 25px
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );
        }

        .login-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .bottom {
            margin-top: 22px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }

        .bottom a {
            color: #60a5fa;

            text-decoration: none;

            font-weight: 700;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #94a3b8;
        }

        .forgot {
            display: block;

            text-align: right;

            margin-top: -8px;
            margin-bottom: 20px;

            color: #60a5fa;

            font-size: 13px;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
        }

        @media (max-width: 480px) {

            .card {
                padding: 23px;
            }

            .logo h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =====================================================
         LOGO
         ===================================================== -->

    <div class="logo">

        <h1>
            REWET <span>HOST</span>
        </h1>

        <p>
            С возвращением!
        </p>

    </div>


    <!-- =====================================================
         LOGIN CARD
         ===================================================== -->

    <div class="card">

        <div class="title">
            Вход в аккаунт
        </div>

        <div class="subtitle">
            Войдите, чтобы продолжить работу с REWET HOST
        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- FORM -->

        <form id="loginForm">

            <!-- LOGIN -->

            <div class="field">

                <label for="login">
                    Username или Email
                </label>

                <input
                    id="login"
                    type="text"
                    placeholder="Введите username или email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Пароль
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- FORGOT -->

            <a
                href="#"
                class="forgot"
                onclick="forgotPassword(event)"
            >
                Забыли пароль?
            </a>


            <!-- BUTTON -->

            <button
                id="loginButton"
                class="login-btn"
                type="submit"
            >

                <span id="buttonText">
                    Войти
                </span>

                <span id="loading" class="loading">
                    Вход...
                </span>

            </button>

        </form>


        <!-- REGISTER -->

        <div class="bottom">

            Нет аккаунта?

            <a href="register.html">
                Зарегистрироваться
            </a>

        </div>


        <!-- BACK -->

        <a
            class="back"
            href="index.html"
        >
            ← Вернуться на главную
        </a>

    </div>

</div>


<script>

    // ========================================================
    // REWET HOST API
    // ========================================================

    const API_URL =
        "https://rewet-host-api.onrender.com";


    // ========================================================
    // ELEMENTS
    // ========================================================

    const form =
        document.getElementById(
            "loginForm"
        );

    const message =
        document.getElementById(
            "message"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const buttonText =
        document.getElementById(
            "buttonText"
        );

    const loading =
        document.getElementById(
            "loading"
        );


    // ========================================================
    // MESSAGE
    // ========================================================

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }


    function hideMessage() {

        message.textContent =
            "";

        message.className =
            "message";

    }


    // ========================================================
    // PASSWORD
    // ========================================================

    function togglePassword() {

        const input =
            document.getElementById(
                "password"
            );

        const button =
            document.querySelector(
                ".show-password"
            );


        if (
            input.type ===
            "password"
        ) {

            input.type =
                "text";

            button.textContent =
                "🙈";

        } else {

            input.type =
                "password";

            button.textContent =
                "👁";

        }

    }


    // ========================================================
    // FORGOT PASSWORD
    // ========================================================

    function forgotPassword(
        event
    ) {

        event.preventDefault();

        showMessage(
            "Восстановление пароля добавим следующим этапом."
        );

    }


    // ========================================================
    // LOGIN
    // ========================================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            hideMessage();


            const login =
                document
                    .getElementById(
                        "login"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            // ------------------------------------------------
            // VALIDATION
            // ------------------------------------------------

            if (!login) {

                showMessage(
                    "Введите username или email."
                );

                return;
            }


            if (!password) {

                showMessage(
                    "Введите пароль."
                );

                return;
            }


            // ------------------------------------------------
            // LOADING
            // ------------------------------------------------

            loginButton.disabled =
                true;

            buttonText.style.display =
                "none";

            loading.style.display =
                "inline";


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/login",
                        {
                            method: "POST",

                            credentials:
                                "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    login:
                                        login,

                                    password:
                                        password
                                })
                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );


                // --------------------------------------------
                // ERROR
                // --------------------------------------------

                if (!response.ok) {

                    showMessage(
                        data.detail ||
                        "Неверный логин или пароль."
                    );

                    return;
                }


                // --------------------------------------------
                // SUCCESS
                // --------------------------------------------

                showMessage(
                    "Вход выполнен! Перенаправляем...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    error
                );

                showMessage(
                    "Не удалось подключиться к серверу REWET HOST."
                );

            } finally {

                loginButton.disabled =
                    false;

                buttonText.style.display =
                    "inline";

                loading.style.display =
                    "none";

            }

        }
    );

</script>

</body>
          </html>
