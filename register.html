<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — REWET HOST</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #123b72 0%, #071425 45%, #030912 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo-title span {
            color: #2196ff;
        }

        .logo-text {
            margin-top: 7px;
            color: #91a5bd;
            font-size: 14px;
        }

        .card {
            background: rgba(8, 22, 40, 0.94);
            border: 1px solid rgba(50, 145, 255, 0.22);
            border-radius: 22px;
            padding: 30px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(0, 120, 255, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #91a5bd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #c9d7e7;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #1c3d5e;
            background: #071727;
            color: white;
            border-radius: 12px;
            padding: 0 14px;
            outline: none;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: #2196ff;
            box-shadow: 0 0 0 3px rgba(33, 150, 255, 0.10);
        }

        input::placeholder {
            color: #5d7187;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 0;
            top: 0;
            width: 48px;
            height: 50px;
            border: 0;
            background: transparent;
            color: #8297ad;
            cursor: pointer;
            font-size: 18px;
        }

        .toggle-password:hover {
            color: #2196ff;
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 11px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: rgba(255, 60, 60, 0.10);
            border: 1px solid rgba(255, 70, 70, 0.25);
            color: #ff8585;
        }

        .message.success {
            display: block;
            background: rgba(40, 200, 120, 0.10);
            border: 1px solid rgba(40, 200, 120, 0.25);
            color: #64e6a5;
        }

        .register-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(135deg, #1688ff, #0067d9);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 120, 255, 0.20);
            transition: .2s;
        }

        .register-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(0, 120, 255, 0.30);
        }

        .register-btn:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #8498ae;
            font-size: 14px;
        }

        .bottom a {
            color: #2196ff;
            text-decoration: none;
            font-weight: 700;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .terms {
            color: #61758b;
            font-size: 11px;
            text-align: center;
            line-height: 1.5;
            margin: 16px 0 18px;
        }

        @media (max-width: 520px) {
            .card {
                padding: 23px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .logo-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-title">
            REWET <span>HOST</span>
        </div>

        <div class="logo-text">
            Игровой хостинг нового поколения
        </div>
    </div>

    <div class="card">

        <h1>Создание аккаунта</h1>

        <div class="subtitle">
            Зарегистрируйтесь в REWET HOST
        </div>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="row">

                <div class="field">
                    <label for="firstName">
                        Имя
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Рамзан"
                        autocomplete="given-name"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="field">
                    <label for="lastName">
                        Фамилия
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Гцгу"
                        autocomplete="family-name"
                        maxlength="50"
                        required
                    >
                </div>

            </div>

            <div class="field">
                <label for="username">
                    Никнейм
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Введите ваш ник"
                    autocomplete="username"
                    maxlength="24"
                    required
                >
            </div>

            <div class="field">
                <label for="email">
                    E-Mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@mail.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">
                    Пароль
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="Минимум 6 символов"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        👁
                    </button>

                </div>
            </div>

            <div class="field">
                <label for="passwordConfirm">
                    Повторите пароль
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="passwordConfirm"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePasswordConfirm"
                    >
                        👁
                    </button>

                </div>
            </div>

            <div class="terms">
                Создавая аккаунт, вы соглашаетесь
                с правилами использования REWET HOST.
            </div>

            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                Создать аккаунт
            </button>

        </form>

        <div class="bottom">
            Уже есть аккаунт?
            <a href="login.html">Войти</a>
        </div>

    </div>

</div>


<script>

const API_URL = "https://rewet-host-api.onrender.com";

const form = document.getElementById("registerForm");

const message = document.getElementById("message");

const registerButton =
    document.getElementById("registerButton");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


function togglePassword(inputId, buttonId) {

    const input =
        document.getElementById(inputId);

    const button =
        document.getElementById(buttonId);

    button.addEventListener("click", () => {

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁";

        }

    });

}


togglePassword(
    "password",
    "togglePassword"
);

togglePassword(
    "passwordConfirm",
    "togglePasswordConfirm"
);


form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        showMessage("", "");

        const firstName =
            document
                .getElementById("firstName")
                .value
                .trim();

        const lastName =
            document
                .getElementById("lastName")
                .value
                .trim();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const passwordConfirm =
            document
                .getElementById("passwordConfirm")
                .value;


        // -----------------------------------------
        // ПРОВЕРКИ
        // -----------------------------------------

        if (firstName.length < 2) {

            showMessage(
                "Введите корректное имя.",
                "error"
            );

            return;
        }


        if (lastName.length < 2) {

            showMessage(
                "Введите корректную фамилию.",
                "error"
            );

            return;
        }


        if (username.length < 3) {

            showMessage(
                "Ник должен содержать минимум 3 символа.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Пароль должен содержать минимум 6 символов.",
                "error"
            );

            return;
        }


        if (password !== passwordConfirm) {

            showMessage(
                "Пароли не совпадают.",
                "error"
            );

            return;
        }


        // -----------------------------------------
        // БЛОКИРУЕМ КНОПКУ
        // -----------------------------------------

        registerButton.disabled = true;

        registerButton.textContent =
            "Создание аккаунта...";


        try {

            const response = await fetch(
                API_URL + "/api/register",
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        first_name: firstName,

                        last_name: lastName,

                        username: username,

                        email: email,

                        password: password

                    })
                }
            );


            let data = {};

            try {

                data = await response.json();

            } catch {

                data = {};

            }


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Не удалось создать аккаунт"
                );

            }


            showMessage(
                "✅ Аккаунт успешно создан! Переходим в панель...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                800
            );


        } catch (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Ошибка соединения с сервером.",
                "error"
            );

            registerButton.disabled = false;

            registerButton.textContent =
                "Создать аккаунт";
        }

    }
);

</script>

</body>
</html>
