<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — REWET HOST</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #2563eb 0%, #0f172a 45%, #020617 100%);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #60a5fa;
        }

        .logo p {
            margin-top: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 22px;
            padding: 30px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(15px);
        }

        .title {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border-radius: 12px;
            border: 1px solid #334155;

            background: #020617;
            color: white;

            outline: none;
            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #94a3b8;
            cursor: pointer;

            font-size: 18px;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }

        .message {
            display: none;

            padding: 12px;
            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .register-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .bottom {
            margin-top: 22px;

            text-align: center;

            color: #94a3b8;
            font-size: 14px;
        }

        .bottom a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;
            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #94a3b8;
        }

        .loading {
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 23px;
            }

            .logo h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>REWET <span>HOST</span></h1>
        <p>Создай свой аккаунт</p>
    </div>


    <div class="card">

        <div class="title">
            Регистрация
        </div>

        <div class="subtitle">
            Создай аккаунт и начни пользоваться REWET HOST
        </div>


        <div id="message" class="message"></div>


        <form id="registerForm">

            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Имя пользователя
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Например: Retete"
                    autocomplete="username"
                    minlength="3"
                    maxlength="24"
                    required
                >

                <div class="hint">
                    3–24 символа: латинские буквы, цифры, _ и -
                </div>

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="255"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Пароль
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Минимум 6 символов"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="field">

                <label for="confirmPassword">
                    Повторите пароль
                </label>

                <div class="password-box">

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                id="registerButton"
                class="register-btn"
                type="submit"
            >
                <span id="buttonText">
                    Создать аккаунт
                </span>

                <span id="loading" class="loading">
                    Создание...
                </span>
            </button>

        </form>


        <div class="bottom">
            Уже есть аккаунт?
            <a href="login.html">
                Войти
            </a>
        </div>

        <a
            class="back"
            href="index.html"
        >
            ← Вернуться на главную
        </a>

    </div>

</div>


<script>

    // ========================================================
    // REWET HOST API
    // ========================================================

    const API_URL =
        "https://rewet-host-api.onrender.com";


    // ========================================================
    // ELEMENTS
    // ========================================================

    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const registerButton =
        document.getElementById("registerButton");

    const buttonText =
        document.getElementById("buttonText");

    const loading =
        document.getElementById("loading");


    // ========================================================
    // MESSAGE
    // ========================================================

    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    function hideMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    // ========================================================
    // PASSWORD
    // ========================================================

    function togglePassword(
        inputId,
        button
    ) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁";

        }

    }


    // ========================================================
    // REGISTER
    // ========================================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            hideMessage();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // ------------------------------------------------
            // CHECK USERNAME
            // ------------------------------------------------

            if (username.length < 3) {

                showMessage(
                    "Username должен содержать минимум 3 символа."
                );

                return;
            }


            const usernameRegex =
                /^[a-zA-Z0-9_-]+$/;

            if (!usernameRegex.test(username)) {

                showMessage(
                    "Username может содержать только латинские буквы, цифры, _ и -."
                );

                return;
            }


            // ------------------------------------------------
            // CHECK EMAIL
            // ------------------------------------------------

            const emailRegex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) {

                showMessage(
                    "Введите корректный email."
                );

                return;
            }


            // ------------------------------------------------
            // CHECK PASSWORD
            // ------------------------------------------------

            if (password.length < 6) {

                showMessage(
                    "Пароль должен содержать минимум 6 символов."
                );

                return;
            }


            // ------------------------------------------------
            // CONFIRM PASSWORD
            // ------------------------------------------------

            if (password !== confirmPassword) {

                showMessage(
                    "Пароли не совпадают."
                );

                return;
            }


            // ------------------------------------------------
            // LOADING
            // ------------------------------------------------

            registerButton.disabled = true;

            buttonText.style.display = "none";

            loading.style.display = "inline";


            try {

                const response =
                    await fetch(
                        API_URL + "/api/register",
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username: username,

                                email: email,

                                password: password

                            })
                        }
                    );


                const data =
                    await response.json()
                        .catch(() => ({}));


                // --------------------------------------------
                // ERROR
                // --------------------------------------------

                if (!response.ok) {

                    let errorText =
                        "Не удалось создать аккаунт.";

                    if (data.detail) {

                        errorText =
                            data.detail;

                    }

                    showMessage(
                        errorText,
                        "error"
                    );

                    return;
                }


                // --------------------------------------------
                // SUCCESS
                // --------------------------------------------

                showMessage(
                    "Аккаунт успешно создан! Перенаправляем...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "Не удалось подключиться к серверу REWET HOST."
                );

            } finally {

                registerButton.disabled = false;

                buttonText.style.display =
                    "inline";

                loading.style.display =
                    "none";

            }

        }
    );

</script>

</body>
  </html>
