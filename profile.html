<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Профиль — REWET HOST</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    #2563eb 0%,
                    #172554 32%,
                    #0f172a 60%,
                    #020617 100%
                );

            padding-bottom: 40px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {
            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(
                    2,
                    6,
                    23,
                    0.78
                );

            border-bottom:
                1px solid
                rgba(
                    96,
                    165,
                    250,
                    0.15
                );

            backdrop-filter:
                blur(18px);
        }

        .navbar {
            width: 100%;

            max-width: 1100px;

            min-height: 70px;

            margin: 0 auto;

            padding:
                0 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 20px;

            font-weight: 900;

            letter-spacing: 1px;
        }

        .logo-icon {
            width: 37px;
            height: 37px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #60a5fa
                );

            box-shadow:
                0 8px 25px
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );
        }

        .logo span {
            color: #60a5fa;
        }


        /* =====================================================
           BACK
           ===================================================== */

        .back {
            color: #93c5fd;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s;
        }

        .back:hover {
            color: white;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {
            width: 100%;

            max-width: 850px;

            margin: 0 auto;

            padding:
                60px 20px;
        }


        /* =====================================================
           PROFILE HEADER
           ===================================================== */

        .profile-title {
            text-align: center;

            margin-bottom: 35px;
        }

        .profile-title h1 {
            font-size:
                clamp(
                    30px,
                    6vw,
                    46px
                );

            font-weight: 900;

            margin-bottom: 10px;
        }

        .profile-title p {
            color: #94a3b8;

            font-size: 15px;
        }


        /* =====================================================
           PROFILE CARD
           ===================================================== */

        .profile-card {

            position: relative;

            overflow: hidden;

            padding: 35px;

            border:
                1px solid
                rgba(
                    96,
                    165,
                    250,
                    0.22
                );

            border-radius: 24px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.88
                );

            box-shadow:
                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );
        }

        .profile-card::before {

            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            top: -130px;
            right: -100px;

            border-radius: 50%;

            background:
                rgba(
                    59,
                    130,
                    246,
                    0.16
                );

            filter: blur(60px);

            pointer-events: none;
        }


        /* =====================================================
           USER TOP
           ===================================================== */

        .user-top {

            position: relative;

            display: flex;

            align-items: center;

            gap: 20px;

            padding-bottom: 30px;

            border-bottom:
                1px solid
                rgba(
                    148,
                    163,
                    184,
                    0.10
                );
        }


        /* =====================================================
           AVATAR
           ===================================================== */

        .big-avatar {

            width: 85px;
            height: 85px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 23px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #60a5fa
                );

            box-shadow:
                0 12px 35px
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );

            font-size: 34px;

            font-weight: 900;
        }


        .user-name-box h2 {

            font-size: 25px;

            margin-bottom: 7px;

            word-break: break-word;
        }

        .user-status {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            color: #86efac;

            font-size: 13px;

            font-weight: 700;
        }

        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px
                rgba(
                    34,
                    197,
                    94,
                    0.7
                );
        }


        /* =====================================================
           INFO
           ===================================================== */

        .info-list {

            padding-top: 25px;
        }

        .info-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding:
                18px 0;

            border-bottom:
                1px solid
                rgba(
                    148,
                    163,
                    184,
                    0.08
                );
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {

            color: #64748b;

            font-size: 13px;

            font-weight: 700;
        }

        .info-value {

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 700;

            text-align: right;

            word-break: break-word;
        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 25px;
        }

        .action {

            min-height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 800;

            transition: 0.2s;

            cursor: pointer;
        }

        .home-button {

            border:
                1px solid
                #334155;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.8
                );

            color: #cbd5e1;
        }

        .home-button:hover {

            border-color:
                #3b82f6;

            color: white;
        }

        .logout-button {

            border:
                1px solid
                rgba(
                    248,
                    113,
                    113,
                    0.25
                );

            background:
                rgba(
                    127,
                    29,
                    29,
                    0.14
                );

            color: #fca5a5;
        }

        .logout-button:hover {

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.18
                );

            border-color:
                rgba(
                    248,
                    113,
                    113,
                    0.5
                );
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {

            display: none;

            margin-bottom: 20px;

            padding: 14px;

            border-radius: 12px;

            font-size: 14px;

            line-height: 1.5;
        }

        .message.error {

            display: block;

            color: #fca5a5;

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.10
                );

            border:
                1px solid
                rgba(
                    239,
                    68,
                    68,
                    0.25
                );
        }


        /* =====================================================
           NOT AUTHORIZED
           ===================================================== */

        .not-auth {

            display: none;

            text-align: center;

            padding: 50px 20px;
        }

        .not-auth-icon {

            font-size: 50px;

            margin-bottom: 20px;
        }

        .not-auth h2 {

            font-size: 25px;

            margin-bottom: 10px;
        }

        .not-auth p {

            color: #64748b;

            margin-bottom: 25px;

            line-height: 1.6;
        }

        .login-button {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 50px;

            padding:
                0 25px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            font-size: 14px;

            font-weight: 800;
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading {

            min-height: 350px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .loader {

            width: 45px;
            height: 45px;

            border:
                4px solid
                rgba(
                    96,
                    165,
                    250,
                    0.15
                );

            border-top-color:
                #3b82f6;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        footer {

            max-width: 850px;

            margin: 0 auto;

            padding:
                0 20px;

            text-align: center;

            color: #475569;

            font-size: 12px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .navbar {
                min-height: 64px;
            }

            .logo {
                font-size: 17px;
            }

            .logo-icon {
                width: 33px;
                height: 33px;
            }

            .back {
                font-size: 12px;
            }

            main {
                padding:
                    40px 15px;
            }

            .profile-card {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .user-top {
                align-items: flex-start;
            }

            .big-avatar {
                width: 68px;
                height: 68px;

                border-radius: 18px;

                font-size: 27px;
            }

            .user-name-box h2 {
                font-size: 21px;
            }

            .info-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .info-value {
                text-align: left;
            }

            .actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <nav class="navbar">


            <a
                href="index.html"
                class="logo"
            >

                <div class="logo-icon">
                    R
                </div>

                <div>
                    REWET <span>HOST</span>
                </div>

            </a>


            <a
                href="index.html"
                class="back"
            >
                ← На главную
            </a>


        </nav>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>


        <!-- TITLE -->

        <div class="profile-title">

            <h1>
                Мой профиль
            </h1>

            <p>
                Управление аккаунтом REWET HOST
            </p>

        </div>


        <!-- =================================================
             LOADING
             ================================================= -->

        <div
            id="loading"
            class="loading"
        >

            <div class="loader"></div>

        </div>


        <!-- =================================================
             NOT AUTH
             ================================================= -->

        <div
            id="notAuth"
            class="profile-card not-auth"
        >

            <div class="not-auth-icon">
                🔐
            </div>

            <h2>
                Вы не авторизованы
            </h2>

            <p>
                Войдите в аккаунт REWET HOST,
                чтобы открыть свой профиль.
            </p>

            <a
                href="login.html"
                class="login-button"
            >
                Войти в аккаунт
            </a>

        </div>


        <!-- =================================================
             PROFILE
             ================================================= -->

        <div
            id="profileCard"
            class="profile-card"
            style="display: none;"
        >


            <div
                id="message"
                class="message"
            ></div>


            <!-- USER -->

            <div class="user-top">


                <div
                    id="bigAvatar"
                    class="big-avatar"
                >
                    U
                </div>


                <div class="user-name-box">

                    <h2 id="profileUsername">
                        Пользователь
                    </h2>

                    <div class="user-status">

                        <span class="status-dot"></span>

                        Аккаунт активен

                    </div>

                </div>


            </div>


            <!-- INFO -->

            <div class="info-list">


                <div class="info-row">

                    <div class="info-label">
                        👤 Username
                    </div>

                    <div
                        id="infoUsername"
                        class="info-value"
                    >
                        —
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        📧 Email
                    </div>

                    <div
                        id="infoEmail"
                        class="info-value"
                    >
                        —
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        🆔 ID пользователя
                    </div>

                    <div
                        id="infoId"
                        class="info-value"
                    >
                        —
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        📅 Дата регистрации
                    </div>

                    <div
                        id="infoCreated"
                        class="info-value"
                    >
                        —
                    </div>

                </div>


            </div>


            <!-- ACTIONS -->

            <div class="actions">


                <a
                    href="index.html"
                    class="action home-button"
                >
                    ← На главную
                </a>


                <button
                    id="logoutButton"
                    class="action logout-button"
                >
                    🚪 Выйти
                </button>


            </div>


        </div>


    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        © 2026 REWET HOST

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        // =====================================================
        // API
        // =====================================================

        const API_URL =
            "https://rewet-host-api.onrender.com";


        // =====================================================
        // ELEMENTS
        // =====================================================

        const loading =
            document.getElementById(
                "loading"
            );

        const profileCard =
            document.getElementById(
                "profileCard"
            );

        const notAuth =
            document.getElementById(
                "notAuth"
            );

        const bigAvatar =
            document.getElementById(
                "bigAvatar"
            );

        const profileUsername =
            document.getElementById(
                "profileUsername"
            );

        const infoUsername =
            document.getElementById(
                "infoUsername"
            );

        const infoEmail =
            document.getElementById(
                "infoEmail"
            );

        const infoId =
            document.getElementById(
                "infoId"
            );

        const infoCreated =
            document.getElementById(
                "infoCreated"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        // =====================================================
        // SHOW NOT AUTH
        // =====================================================

        function showNotAuth() {

            loading.style.display =
                "none";

            profileCard.style.display =
                "none";

            notAuth.style.display =
                "block";

        }


        // =====================================================
        // FORMAT DATE
        // =====================================================

        function formatDate(value) {

            if (!value) {
                return "Не указана";
            }

            try {

                const date =
                    new Date(value);

                if (
                    Number.isNaN(
                        date.getTime()
                    )
                ) {
                    return value;
                }

                return date.toLocaleDateString(
                    "ru-RU",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

            } catch {

                return value;

            }

        }


        // =====================================================
        // SHOW PROFILE
        // =====================================================

        function showProfile(user) {

            loading.style.display =
                "none";

            notAuth.style.display =
                "none";

            profileCard.style.display =
                "block";


            const username =
                user.username ||
                "Пользователь";


            profileUsername.textContent =
                username;


            infoUsername.textContent =
                username;


            infoEmail.textContent =
                user.email ||
                "Не указана";


            infoId.textContent =
                user.id ??
                "—";


            infoCreated.textContent =
                formatDate(
                    user.created_at
                );


            bigAvatar.textContent =
                username
                    .charAt(0)
                    .toUpperCase();

        }


        // =====================================================
        // CHECK AUTH
        // =====================================================

        async function loadProfile() {

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/me",
                        {
                            method: "GET",

                            credentials:
                                "include",

                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                if (!response.ok) {

                    showNotAuth();

                    return;
                }


                const data =
                    await response
                        .json();


                if (
                    !data ||
                    !data.user
                ) {

                    showNotAuth();

                    return;
                }


                showProfile(
                    data.user
                );


            } catch (error) {

                console.error(
                    "Ошибка /api/me:",
                    error
                );

                showNotAuth();

            }

        }


        // =====================================================
        // LOGOUT
        // =====================================================

        logoutButton.addEventListener(
            "click",
            async function() {

                logoutButton.disabled =
                    true;

                logoutButton.textContent =
                    "Выход...";


                try {

                    await fetch(
                        API_URL +
                        "/api/logout",
                        {
                            method: "POST",

                            credentials:
                                "include"
                        }
                    );

                } catch (error) {

                    console.error(
                        error
                    );

                }


                window.location.href =
                    "index.html";

            }
        );


        // =====================================================
        // START
        // =====================================================

        loadProfile();


    </script>


</body>

  </html>
